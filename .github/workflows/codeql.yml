name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read
  # The CodeQL action reads the workflow run (get-a-workflow-run) even when results are not uploaded.
  actions: read
  security-events: read

jobs:
  analyze:
    name: Analyze Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.14904198"
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: java-kotlin
      - name: Build Android app for CodeQL
        working-directory: android
        # CodeQL must observe compilation; cached Gradle tasks produce no
        # Java/Kotlin extraction data on hosted runners.
        # gradle.properties asks for an 8 GB heap, more than the ~7 GB runner has; with a separate
        # Kotlin daemon and the CodeQL tracer the runner was being killed mid-build. Compile Kotlin
        # inside one capped Gradle daemon and limit parallel workers.
        run: >-
          ./gradlew --no-configuration-cache --rerun-tasks --max-workers=2
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          :app:assembleDebug
      - name: Stop Gradle and Kotlin daemons
        # The build leaves daemons holding several GB and the runner has ~7 GB; free it before the
        # CodeQL query evaluation, which was dying silently mid-run.
        working-directory: android
        run: ./gradlew --stop
      # Code scanning is unavailable on this private repository's plan, so uploading results to
      # GitHub fails the job. Keep the analysis, write the SARIF locally, and publish it as an artifact.
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          upload: never
          output: codeql-results
          ram: 5120
          threads: 2
      - name: Upload CodeQL results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: warn
          retention-days: 30
